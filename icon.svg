
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102E50"/>
      <stop offset="100%" stop-color="#071522"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DDF6FF"/>
      <stop offset="100%" stop-color="#8DDCFF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Back cards -->
  <g transform="rotate(-13 256 256)">
    <rect x="128" y="111" width="224" height="300" rx="22"
          fill="#174C77" stroke="#48B9EF" stroke-width="7"/>
  </g>
  <g transform="rotate(13 256 256)">
    <rect x="160" y="111" width="224" height="300" rx="22"
          fill="#2477A8" stroke="#75D5FF" stroke-width="7"/>
  </g>

  <!-- Main card -->
  <rect x="144" y="91" width="224" height="320" rx="22"
        fill="url(#card)" stroke="#FFFFFF" stroke-width="5"/>

  <!-- Ace symbol -->
  <text x="169" y="151" font-family="Georgia,serif"
        font-size="43" font-weight="bold" fill="#102E50">A</text>
  <text x="169" y="193" font-family="Georgia,serif"
        font-size="43" fill="#102E50">♠</text>

  <text x="256" y="310" text-anchor="middle"
        font-family="Georgia,serif" font-size="178"
        fill="#102E50">♠</text>

  <!-- Bottom corner -->
  <g transform="rotate(180 256 350)">
    <text x="169" y="351" font-family="Georgia,serif"
          font-size="43" font-weight="bold" fill="#102E50">A</text>
    <text x="169" y="393" font-family="Georgia,serif"
          font-size="43" fill="#102E50">♠</text>
  </g>

  <!-- Small tech detail -->
  <circle cx="393" cy="390" r="9" fill="#62D3FF"/>
  <circle cx="416" cy="390" r="5" fill="#62D3FF" opacity=".6"/>
</svg>
