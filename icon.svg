
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#153d5c"/>
      <stop offset="100%" stop-color="#071522"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8eaff"/>
      <stop offset="100%" stop-color="#68b9ef"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="22" y="22" width="468" height="468" rx="96"
        fill="none" stroke="#68b9ef" stroke-opacity=".35" stroke-width="3"/>

  <g fill="url(#blue)" text-anchor="middle"
     font-family="Georgia,serif" font-size="112">
    <text x="175" y="220">♠</text>
    <text x="337" y="220">♥</text>
    <text x="175" y="365">♣</text>
    <text x="337" y="365">♦</text>
  </g>

  <circle cx="256" cy="256" r="43" fill="#10263a"
          stroke="#c8eaff" stroke-width="5"/>
  <text x="256" y="270" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="37"
        font-weight="900" fill="#ffffff">S</text>
</svg>
